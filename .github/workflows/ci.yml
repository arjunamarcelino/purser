name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read            # least privilege

# Actions are pinned to full commit SHAs (immutable); the trailing comment tracks the version.
jobs:
  contract:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contract
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@035fceb3c12fb0c6a9461b52775e16473133e591 # 1.95.0
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: contract
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets -- -D warnings
      # Installed BEFORE `cargo test`: the near-workspaces suites compile the contract via
      # `compile_project`, which spawns the `cargo near` CLI from PATH.
      - name: Install cargo-near (official prebuilt binary — avoids a source build of hidapi/libudev)
        run: curl --proto '=https' --tlsv1.2 -LsSf https://github.com/near/cargo-near/releases/download/cargo-near-v0.22.0/cargo-near-installer.sh | sh
      - run: cargo test
      - run: cargo near build non-reproducible-wasm   # also emits target/near/*_abi.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: wasm-and-abi
          path: contract/target/near/*

  secrets:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read       # gitleaks-action reads the PR commit range via the pulls API
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          # Required since gitleaks-action v2 for pull_request scans.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Don't post PR comments → avoids needing pull-requests: write (keeps the
          # job read-only). The exit code still fails the job on any finding.
          GITLEAKS_ENABLE_COMMENTS: "false"
