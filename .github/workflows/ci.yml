name: ci
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 3 * * *"     # nightly: the deep property run

permissions:
  contents: read            # least privilege

# Actions are pinned to full commit SHAs (immutable); the trailing comment tracks the version.
#
# Layout: `lint`, `wasm` and `host-tests` run in parallel; `sandbox-tests` waits only for `wasm`
# and runs the near-workspaces suites against the artifacts `wasm` built ONCE (passed in via
# PURSER_WASM_*), so no job rebuilds a wasm another job already built.
jobs:
  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contract
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@035fceb3c12fb0c6a9461b52775e16473133e591 # 1.95.0
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: |
            contract -> target
            contract/tests/fixtures/race-driver -> ../../../target/race-driver
            contract/tests/fixtures/mock-signer -> ../../../target/mock-signer
          cache-on-failure: true
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets -- -D warnings
      - name: Static security audit (TRD S1-S4, S7, S8) and its seeded-violation self-test
        run: ../scripts/audit-security.sh && ../scripts/audit-security-selftest.sh
      - name: README names only things that exist (make targets, scripts, relative links)
        run: node ../scripts/check-readme.mjs
      - run: PURSER_ALLOW_FAULT_INJECTION=1 cargo clippy --all-targets --features fault-injection -- -D warnings   # the test-only fault build must lint too
      - name: Lint the race-driver test fixture (not a member of any workspace)
        run: |
          cargo fmt --manifest-path tests/fixtures/race-driver/Cargo.toml -- --check
          CARGO_TARGET_DIR="$PWD/target/race-driver" cargo clippy --locked --manifest-path tests/fixtures/race-driver/Cargo.toml --all-targets -- -D warnings
      - name: Lint the mock-signer test fixture (not a member of any workspace)
        run: |
          cargo fmt --manifest-path tests/fixtures/mock-signer/Cargo.toml -- --check
          CARGO_TARGET_DIR="$PWD/target/mock-signer" cargo clippy --locked --manifest-path tests/fixtures/mock-signer/Cargo.toml --all-targets -- -D warnings
      - name: Keep the sandbox-only race driver out of deploy tooling
        run: "! grep -rn --exclude=metrics.sh race-driver ../scripts ../Makefile"   # metrics.sh builds it for the local sandbox harness
      - name: Keep the race-driver toolchain and near-sdk pin in lock-step with the contract
        run: |
          diff <(grep -v '^#' rust-toolchain.toml) <(grep -v '^#' tests/fixtures/race-driver/rust-toolchain.toml)
          pin() { grep -m1 '^near-sdk' "$1" | grep -oE '"=[0-9.]+"'; }   # first near-sdk line, string or table form
          [ "$(pin Cargo.toml)" = "$(pin tests/fixtures/race-driver/Cargo.toml)" ]
      - name: Keep the sandbox-only mock signer out of deploy tooling
        run: "! grep -rn --exclude=metrics.sh mock-signer ../scripts ../Makefile"   # metrics.sh builds it for the local sandbox harness
      - name: Keep the mock-signer toolchain and near-sdk pin in lock-step with the contract
        run: |
          diff <(grep -v '^#' rust-toolchain.toml) <(grep -v '^#' tests/fixtures/mock-signer/rust-toolchain.toml)
          pin() { grep -m1 '^near-sdk' "$1" | grep -oE '"=[0-9.]+"'; }   # first near-sdk line, string or table form
          [ "$(pin Cargo.toml)" = "$(pin tests/fixtures/mock-signer/Cargo.toml)" ]

  wasm:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contract
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@035fceb3c12fb0c6a9461b52775e16473133e591 # 1.95.0
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: |
            contract -> target
            contract/tests/fixtures/race-driver -> ../../../target/race-driver
            contract/tests/fixtures/mock-signer -> ../../../target/mock-signer
          cache-on-failure: true
      - name: Install cargo-near (official prebuilt binary — avoids a source build of hidapi/libudev)
        run: '"$GITHUB_WORKSPACE/scripts/ci-install-cargo-near.sh"'
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - run: cargo near build non-reproducible-wasm   # the shipped wasm; also emits target/near/*_abi.json
      - run: ../scripts/check-wasm-clean.sh target/near/purser_contract.wasm      # never ship a fault-injection build
      - name: Build the test-only artifacts (fault-injection contract, race driver, mock signer)
        run: |
          CARGO_TARGET_DIR="$PWD/target/fault-injection" cargo near build non-reproducible-wasm --locked --no-abi \
            --features fault-injection --env PURSER_ALLOW_FAULT_INJECTION=1
          CARGO_TARGET_DIR="$PWD/target/race-driver" cargo near build non-reproducible-wasm --locked --no-abi \
            --manifest-path tests/fixtures/race-driver/Cargo.toml
          CARGO_TARGET_DIR="$PWD/target/mock-signer" cargo near build non-reproducible-wasm --locked --no-abi \
            --manifest-path tests/fixtures/mock-signer/Cargo.toml
          mkdir -p test-wasms
          cp target/fault-injection/near/purser_contract.wasm test-wasms/fault.wasm
          cp target/race-driver/near/race_driver.wasm test-wasms/driver.wasm
          cp target/mock-signer/near/mock_signer.wasm test-wasms/mock-signer.wasm
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: wasm-and-abi
          path: contract/target/near/*
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-wasms     # TEST-ONLY artifacts; never deploy these
          path: contract/test-wasms/*

  host-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contract
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@035fceb3c12fb0c6a9461b52775e16473133e591 # 1.95.0
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: |
            contract -> target
            contract/tests/fixtures/mock-signer -> ../../../target/mock-signer
          cache-on-failure: true
      - run: cargo test --lib
      - name: Mock-signer fixture host tests (derivation vector, sign/ecrecover)
        run: CARGO_TARGET_DIR="$PWD/target/mock-signer" cargo test --locked --manifest-path tests/fixtures/mock-signer/Cargo.toml
      # Property depth is tiered: a quick pass on PRs, the in-code defaults (10k pure-core /
      # 2k contract cases) on main, and a deep run nightly.
      - name: Property tests (PR)
        if: github.event_name == 'pull_request'
        run: PROPTEST_CASES=256 cargo test --test properties
      - name: Property tests (main)
        if: github.event_name == 'push'
        run: cargo test --test properties
      - name: Property tests (nightly, deep)
        if: github.event_name == 'schedule'
        run: PROPTEST_CASES=20000 cargo test --test properties

  sandbox-tests:
    needs: wasm
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contract
    env:
      PURSER_WASM_PROD: ${{ github.workspace }}/wasm/prod/purser_contract.wasm
      PURSER_WASM_FAULT: ${{ github.workspace }}/wasm/test/fault.wasm
      PURSER_WASM_DRIVER: ${{ github.workspace }}/wasm/test/driver.wasm
      PURSER_WASM_MOCK_SIGNER: ${{ github.workspace }}/wasm/test/mock-signer.wasm
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@035fceb3c12fb0c6a9461b52775e16473133e591 # 1.95.0
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: contract -> target
          cache-on-failure: true
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: wasm-and-abi
          path: wasm/prod
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: test-wasms
          path: wasm/test
      - run: cargo test --test attacks --test payments --test delegates --test evm --test limits --test refusals -- --test-threads=4
      - name: "Metrics harness (single-threaded: its latency samples are wall-clock)"
        run: cargo test --test metrics -- --test-threads=1

  # In-place upgrade: the previous release (merge-base with main) writes state, this tree's wasm reads it.
  upgrade-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0     # the previous release is built from git history
      - uses: dtolnay/rust-toolchain@035fceb3c12fb0c6a9461b52775e16473133e591 # 1.95.0
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: contract -> target
          cache-on-failure: true
      - name: Install cargo-near (official prebuilt binary)
        run: '"$GITHUB_WORKSPACE/scripts/ci-install-cargo-near.sh"'
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - run: |
          git fetch origin main
          scripts/upgrade-check.sh

  # TS workspace: typecheck + unit tests against the COMMITTED generated types (no wasm needed).
  ts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0 (version from packageManager)
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r --workspace-concurrency=1 run typecheck
      - run: pnpm --filter @purser/app build   # before tests: the app's test scans dist/ for secrets
      - run: pnpm --filter @purser/landing build
      - run: pnpm -r run test
      - name: "Metrics aggregator self-test (fixtures: good set, overrun, missing metric)"
        run: node --test scripts/metrics-report.test.mjs

  # The committed generated types must match the ABI of the wasm this run built.
  types-drift:
    needs: wasm
    runs-on: ubuntu-latest
    env:
      PURSER_ABI: ${{ github.workspace }}/wasm/prod/purser_contract_abi.json
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: wasm-and-abi
          path: wasm/prod
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @purser/types run gen
      - name: Fail if generated types drifted from the ABI (run `make types-gen` and commit)
        run: git diff --exit-code packages/types/src/generated.ts

  # The proposer against a local chain (nearcore 2.14, sha256-pinned), using the wasm this run built.
  # Scripted models only: no NEAR AI secrets in CI.
  ts-sandbox:
    needs: wasm
    runs-on: ubuntu-latest
    env:
      PURSER_WASM_PROD: ${{ github.workspace }}/wasm/prod/purser_contract.wasm
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: wasm-and-abi
          path: wasm/prod
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/purser
          key: near-sandbox-${{ runner.os }}-${{ hashFiles('scripts/sandbox-bin.sh') }}
      - run: pnpm install --frozen-lockfile
      - name: Proposer crew + model-independence property on a local chain
        run: NEAR_SANDBOX_BIN_PATH="$(scripts/sandbox-bin.sh)" pnpm --filter @purser/proposer run test:sandbox
      - name: Indexer cache proofs (kill the poller, rebuild from empty) on a local chain
        run: NEAR_SANDBOX_BIN_PATH="$(scripts/sandbox-bin.sh)" pnpm --filter @purser/indexer run test:sandbox

  secrets:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read       # gitleaks-action reads the PR commit range via the pulls API
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          # Required since gitleaks-action v2 for pull_request scans.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Don't post PR comments → avoids needing pull-requests: write (keeps the
          # job read-only). The exit code still fails the job on any finding.
          GITLEAKS_ENABLE_COMMENTS: "false"
