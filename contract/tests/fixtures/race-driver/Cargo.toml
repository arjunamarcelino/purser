# TEST-ONLY fixture for contract/tests/attacks.rs. NEVER deploy it outside a near-workspaces
# sandbox: it forwards calls as the account that hosts it.
[package]
name = "race-driver"
version = "0.0.0"
edition = "2021"
rust-version = "1.95"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "=5.30.0"   # lock-step with contract/Cargo.toml

[dev-dependencies]
near-sdk = { version = "=5.30.0", features = ["unit-testing"] }   # satisfies near-sdk's host-build cfg guard (clippy)

[lints.rust.unexpected_cfgs]
level = "warn"
check-cfg = ['cfg(near)']

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true

# Standalone: never part of any parent workspace.
[workspace]
