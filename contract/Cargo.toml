[package]
name = "purser-contract"
version = "0.1.0"
edition = "2021"            # conservative; canonical cargo-near template is edition 2024
rust-version = "1.95"
repository = "https://github.com/arjunamarcelino/purser"
license = "MIT OR Apache-2.0"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]   # cdylib -> wasm; rlib -> in-crate integration tests

[features]
# TEST-ONLY lost-callback fault for the attack suite; build.rs refuses it without
# PURSER_ALLOW_FAULT_INJECTION=1 (see README "Develop").
fault-injection = []
# EVM sighash FEASIBILITY SPIKE (docs/plans/2026-11-05-feat-evm-sighash-feasibility-spike-plan.md): MEASUREMENT
# ONLY. Adds two raw wasm exports (not #[near], so not in the ABI) over the shared `evm_tx` encoder. build.rs refuses it
# without PURSER_ALLOW_EVM_SPIKE=1; scripts/check-wasm-clean.sh refuses any wasm that contains it.
evm-spike = []

[dependencies]
# `unstable` exposes `env::ecrecover` (verify the MPC signature against the cached derived key). Nothing else
# from that feature is used; the pin is unchanged.
near-sdk = { version = "=5.30.0", features = ["unstable"] }

[dev-dependencies]
near-sdk = { version = "=5.30.0", features = ["unit-testing"] }
near-workspaces = { version = "=0.24.0", features = ["unstable"] }  # `unstable` exposes compile_project (compile-to-wasm in-test)
tokio = { version = "1", features = ["full"] }
anyhow = "1"
serde_json = "1"
proptest = "=1.12.0"
# TEST-ONLY independent hash oracle for the payload_hash re-derivation test. sha2 0.11 is the exact
# crate near-sdk-env uses for its off-chain backend; the digest is identical across any sha2 version.
# Do NOT touch the near-workspaces `unstable` feature above — `compile_project` needs it.
sha2 = "0.11"
# TEST-ONLY independent oracles for the EVM spike (hand-rolled RLP vs the parity `rlp` crate, host keccak vs
# `sha3`). Exact pins; never normal dependencies, so they cannot reach the wasm.
rlp = "=0.6.1"
sha3 = "=0.10.9"
# TEST-ONLY secp256k1 signer for the EVM path's host tests (sign a contract-built sighash, then let the contract's
# own `env::ecrecover` check it). Never a normal dependency: no k256 in the wasm.
k256 = { version = "=0.13.4", features = ["ecdsa"] }

# REQUIRED: near-sdk 5.27+ expands cfg(near)-gated code into this crate. Plain
# `cargo clippy`/`cargo test` (no --cfg near) would otherwise raise unexpected_cfgs,
# which `-D warnings` promotes to a hard error. Ships in the canonical template.
[lints.rust.unexpected_cfgs]
level = "warn"
check-cfg = ['cfg(near)']

# Optimized deps for host test builds (~6x faster mocked-VM property tests); our crate keeps dev
# settings, and the wasm uses [profile.release].
[profile.dev.package."*"]
opt-level = 2

# ⚠️ WORKSPACE-PROMOTION HAZARD: Cargo honors [profile.*] ONLY in the workspace-root manifest.
# If this crate ever joins a Cargo workspace, this block is silently ignored and the wasm rebuilds
# WITHOUT overflow-checks (a money-safety setting). On promotion, move [profile.release] (and
# rust-toolchain.toml) to the root manifest. See docs/plans promotion checklist.
# Also add `exclude = ["contract/tests/fixtures/*"]`: the race-driver fixture is a standalone crate.
[profile.release]          # matches the canonical cargo-near template (cargo-near strips the wasm, so no `strip`)
codegen-units = 1
opt-level = "z"            # size-optimize wasm
lto = true
debug = false
panic = "abort"
overflow-checks = true     # SAFETY: panic on integer overflow — required for a money contract

# Used by `cargo near build reproducible-wasm` (verifiable release build in a pinned Docker image).
# Values from the cargo-near 0.22.0 canonical template; the container's Rust is independent of the
# local 1.95 pin. Needs Docker + a clean committed git tree. Dev builds use non-reproducible-wasm.
[package.metadata.near.reproducible_build]
image = "sourcescan/cargo-near:0.21.1-rust-1.96.0"
image_digest = "sha256:ccb22bb4e677ed022d8b9d1aa1b32f0af52dd0471ef1c32e48dedbf68ee6ee17"
passed_env = []
container_build_command = ["cargo", "near", "build", "non-reproducible-wasm", "--locked"]
