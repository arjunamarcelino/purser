server {
    listen 80;
    listen [::]:80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/json;

    # nginx drops inherited add_header as soon as a location sets its own, so each location repeats these.
    # They mirror app/vite.config.ts, which only covers the dev server: a framing parent could inject a
    # wallet through near-connect's postMessage path.
    set $csp "frame-ancestors 'none'";

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Frame-Options DENY;
        add_header Content-Security-Policy $csp;
        add_header Referrer-Policy no-referrer;
        add_header Cross-Origin-Opener-Policy same-origin-allow-popups;
        add_header X-Content-Type-Options nosniff;
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        add_header X-Frame-Options DENY;
        add_header Content-Security-Policy $csp;
        add_header Referrer-Policy no-referrer;
        add_header Cross-Origin-Opener-Policy same-origin-allow-popups;
        add_header X-Content-Type-Options nosniff;
        try_files $uri $uri/ =404;
    }
}
